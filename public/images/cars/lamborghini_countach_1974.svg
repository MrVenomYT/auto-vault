<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lamboOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8533"/>
      <stop offset="40%" stop-color="#ff5500"/>
      <stop offset="85%" stop-color="#b33c00"/>
      <stop offset="100%" stop-color="#662200"/>
    </linearGradient>
    <radialGradient id="ctSh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <ellipse cx="400" cy="435" rx="360" ry="24" fill="url(#ctSh)"/>

  <circle cx="210" cy="370" r="55" fill="#111"/>
  <circle cx="600" cy="370" r="58" fill="#111"/>

  <!-- Radical Marcello Gandini Wedge Silhouette -->
  <polygon points="90,375 160,320 400,200 480,200 680,280 730,340 720,380 90,380" fill="url(#lamboOrange)" stroke="#802b00" stroke-width="1.5"/>

  <!-- Scissor Door Angular Cut Lines -->
  <path d="M 280 320 L 370 215 L 470 215 L 430 360 L 300 360 Z" fill="none" stroke="#222" stroke-width="2"/>

  <!-- Sharply Raked Front Windshield & Trapezoid Side Windows -->
  <polygon points="260,300 380,210 440,210 390,300" fill="rgba(180,225,255,0.4)" stroke="#111" stroke-width="2"/>
  <polygon points="400,300 450,210 475,210 455,300" fill="rgba(180,225,255,0.4)" stroke="#111" stroke-width="2"/>

  <!-- NACA Side Ducts & Roof Periscopio Channel -->
  <polygon points="500,290 560,260 560,300" fill="#111"/>
  <rect x="440" y="195" width="25" height="8" rx="2" fill="#111"/>

  <!-- Angular Pop Up Headlight Covers -->
  <polygon points="150,335 180,315 220,315 190,335" fill="none" stroke="#ff7733" stroke-width="1.5"/>

  <!-- Campagnolo Bravo Dial Phone Wheels (Signature Countach) -->
  <circle cx="215" cy="380" r="75" fill="#151515"/>
  <circle cx="215" cy="380" r="52" fill="#c0c0c0" stroke="#333" stroke-width="2"/>
  <circle cx="215" cy="355" r="8" fill="#151515"/>
  <circle cx="238" cy="372" r="8" fill="#151515"/>
  <circle cx="230" cy="398" r="8" fill="#151515"/>
  <circle cx="200" cy="398" r="8" fill="#151515"/>
  <circle cx="192" cy="372" r="8" fill="#151515"/>

  <circle cx="595" cy="380" r="78" fill="#151515"/>
  <circle cx="595" cy="380" r="55" fill="#c0c0c0" stroke="#333" stroke-width="2"/>
  <circle cx="595" cy="355" r="9" fill="#151515"/>
  <circle cx="618" cy="372" r="9" fill="#151515"/>
  <circle cx="610" cy="398" r="9" fill="#151515"/>
  <circle cx="580" cy="398" r="9" fill="#151515"/>
  <circle cx="572" cy="372" r="9" fill="#151515"/>
</svg>
