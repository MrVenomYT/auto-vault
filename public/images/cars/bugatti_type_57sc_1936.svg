<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="atlanticBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3038"/>
      <stop offset="35%" stop-color="#181a1f"/>
      <stop offset="85%" stop-color="#0b0c0e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="atSh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <ellipse cx="400" cy="435" rx="360" ry="24" fill="url(#atSh)"/>

  <circle cx="210" cy="370" r="55" fill="#111"/>
  <circle cx="600" cy="370" r="58" fill="#111"/>

  <!-- Art Deco Jean Bugatti Teardrop Fastback Body -->
  <path d="M 90 370 Q 100 300 200 280 L 320 260 Q 370 170 470 170 L 530 180 Q 670 200 730 350 L 720 380 L 90 380 Z" fill="url(#atlanticBlack)" stroke="#222" stroke-width="1.5"/>

  <!-- Signature Riveted Dorsal Fin (Elektron Magnesium Seam) -->
  <path d="M 110 320 Q 350 150 720 340" fill="none" stroke="#ddd" stroke-width="4" stroke-linecap="round"/>
  <!-- Rivet Marks -->
  <g fill="#111">
    <circle cx="220" cy="245" r="1.5"/>
    <circle cx="260" cy="225" r="1.5"/>
    <circle cx="300" cy="205" r="1.5"/>
    <circle cx="340" cy="188" r="1.5"/>
    <circle cx="380" cy="177" r="1.5"/>
    <circle cx="420" cy="173" r="1.5"/>
    <circle cx="460" cy="175" r="1.5"/>
    <circle cx="500" cy="184" r="1.5"/>
    <circle cx="540" cy="200" r="1.5"/>
    <circle cx="580" cy="225" r="1.5"/>
    <circle cx="620" cy="255" r="1.5"/>
  </g>

  <!-- Bugatti Horseshoe Grille -->
  <path d="M 100 330 Q 120 310 140 330 L 135 365 Q 120 370 105 365 Z" fill="#111" stroke="#ddd" stroke-width="2.5"/>

  <!-- Wire Spoke Wheels with Polished Chrome Hubs -->
  <circle cx="215" cy="380" r="75" fill="#151515"/>
  <circle cx="215" cy="380" r="50" fill="none" stroke="#ccc" stroke-width="3"/>
  <circle cx="215" cy="380" r="16" fill="#ddd"/>

  <circle cx="595" cy="380" r="78" fill="#151515"/>
  <circle cx="595" cy="380" r="52" fill="none" stroke="#ccc" stroke-width="3"/>
  <circle cx="595" cy="380" r="16" fill="#ddd"/>
</svg>
