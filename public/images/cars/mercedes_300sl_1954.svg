<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d6dde6"/>
      <stop offset="80%" stop-color="#9aa5b3"/>
      <stop offset="100%" stop-color="#555e69"/>
    </linearGradient>
    <linearGradient id="slChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd3dc"/>
      <stop offset="100%" stop-color="#808b97"/>
    </linearGradient>
    <radialGradient id="slSh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <ellipse cx="400" cy="435" rx="360" ry="25" fill="url(#slSh)"/>

  <!-- Left Perspective Wheels -->
  <circle cx="210" cy="365" r="58" fill="#111"/>
  <circle cx="590" cy="365" r="58" fill="#111"/>

  <!-- Iconic 300 SL Gullwing Bodywork -->
  <path d="M 120 370 Q 110 330 160 310 L 260 290 Q 340 200 440 200 L 520 200 Q 640 240 700 330 Q 720 360 690 380 L 120 380 Z" fill="url(#silver)" stroke="#667280" stroke-width="1.5"/>

  <!-- Greenhouse Glass and Gullwing Roofline -->
  <path d="M 330 280 L 370 210 L 510 210 L 590 280 Z" fill="#16202c" stroke="url(#slChrome)" stroke-width="3"/>
  <path d="M 340 275 L 375 218 L 435 218 L 435 275 Z" fill="rgba(180,215,245,0.45)"/>
  <path d="M 445 275 L 445 218 L 505 218 L 575 275 Z" fill="rgba(180,215,245,0.45)"/>

  <!-- Distinctive 300 SL Eyebrow Wheel Arch Flairs -->
  <path d="M 150 350 Q 220 280 290 350" fill="none" stroke="#7e8c9c" stroke-width="4"/>
  <path d="M 520 350 Q 590 280 660 350" fill="none" stroke="#7e8c9c" stroke-width="4"/>

  <!-- Side Fender Strakes (Air Vents) -->
  <path d="M 280 325 L 320 325 M 280 335 L 320 335" stroke="#222" stroke-width="3"/>
  <line x1="322" y1="320" x2="322" y2="340" stroke="url(#slChrome)" stroke-width="2"/>

  <!-- Low Front Nose and Mercedes Grille Star -->
  <ellipse cx="130" cy="350" rx="15" ry="25" fill="#111" stroke="url(#slChrome)" stroke-width="3"/>
  <line x1="105" y1="350" x2="155" y2="350" stroke="url(#slChrome)" stroke-width="3"/>
  <circle cx="130" cy="350" r="10" fill="none" stroke="url(#slChrome)" stroke-width="2"/>

  <!-- Front Headlight Lens -->
  <ellipse cx="160" cy="320" rx="14" ry="20" fill="#e8f3ff" stroke="url(#slChrome)" stroke-width="2"/>

  <!-- Right Front Chrome Hubcap Wheel -->
  <circle cx="220" cy="380" r="75" fill="#151515"/>
  <circle cx="220" cy="380" r="48" fill="url(#slChrome)" stroke="#444" stroke-width="2"/>
  <circle cx="220" cy="380" r="15" fill="#silver"/>
  <circle cx="220" cy="380" r="8" fill="#151515"/>

  <!-- Right Rear Chrome Hubcap Wheel -->
  <circle cx="590" cy="380" r="75" fill="#151515"/>
  <circle cx="590" cy="380" r="48" fill="url(#slChrome)" stroke="#444" stroke-width="2"/>
  <circle cx="590" cy="380" r="15" fill="#silver"/>
  <circle cx="590" cy="380" r="8" fill="#151515"/>
</svg>
