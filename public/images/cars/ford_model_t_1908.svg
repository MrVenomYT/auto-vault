<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae896"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#7a5818"/>
    </linearGradient>
    <radialGradient id="tSh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <ellipse cx="400" cy="440" rx="350" ry="25" fill="url(#tSh)"/>

  <!-- Left Wheels Perspective -->
  <circle cx="280" cy="340" r="75" fill="none" stroke="#111" stroke-width="8"/>
  <circle cx="560" cy="340" r="75" fill="none" stroke="#111" stroke-width="8"/>

  <!-- Model T Touring Body -->
  <path d="M 180 340 L 260 340 L 290 260 L 610 260 L 630 350 L 180 350 Z" fill="url(#tBlack)" stroke="#333" stroke-width="2"/>
  <!-- Hood and Brass Radiator -->
  <path d="M 180 340 L 190 280 L 290 260 L 290 340 Z" fill="url(#tBlack)" stroke="#222"/>
  <rect x="175" y="275" width="22" height="65" rx="6" fill="url(#brass)" stroke="#523b10" stroke-width="2"/>
  <!-- Radiator Cap -->
  <rect x="182" y="267" width="8" height="8" fill="url(#brass)"/>

  <!-- Brass Headlamps -->
  <circle cx="175" cy="310" r="14" fill="url(#brass)"/>
  <circle cx="175" cy="310" r="9" fill="#fffbe0"/>

  <!-- Folding High Canvas Top (Phaeton Roof) -->
  <path d="M 280 260 L 320 120 L 590 120 L 620 260 Z" fill="#1b1a17" stroke="#111" stroke-width="3"/>
  <!-- Wooden Bow Supports -->
  <line x1="320" y1="120" x2="310" y2="260" stroke="#7a5818" stroke-width="4"/>
  <line x1="450" y1="120" x2="440" y2="260" stroke="#7a5818" stroke-width="4"/>
  <line x1="590" y1="120" x2="600" y2="260" stroke="#7a5818" stroke-width="4"/>

  <!-- Upright Glass Windshield with Brass Frame -->
  <rect x="290" y="180" width="8" height="80" fill="url(#brass)" stroke="#333" stroke-width="1"/>
  <rect x="298" y="185" width="4" height="70" fill="rgba(180,220,240,0.4)"/>

  <!-- Fenders and Running Boards -->
  <path d="M 160 360 Q 230 300 300 370 L 500 370 Q 570 300 650 370" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round"/>

  <!-- Right Front Wooden Spoke Wheel (Foreground) -->
  <circle cx="230" cy="380" r="90" fill="none" stroke="#111" stroke-width="10"/>
  <circle cx="230" cy="380" r="14" fill="url(#brass)"/>
  <g stroke="#804a1f" stroke-width="3.5">
    <line x1="230" y1="290" x2="230" y2="470"/>
    <line x1="140" y1="380" x2="320" y2="380"/>
    <line x1="166" y1="316" x2="294" y2="444"/>
    <line x1="166" y1="444" x2="294" y2="316"/>
  </g>

  <!-- Right Rear Wooden Spoke Wheel (Foreground) -->
  <circle cx="580" cy="380" r="95" fill="none" stroke="#111" stroke-width="10"/>
  <circle cx="580" cy="380" r="15" fill="url(#brass)"/>
  <g stroke="#804a1f" stroke-width="3.5">
    <line x1="580" y1="285" x2="580" y2="475"/>
    <line x1="485" y1="380" x2="675" y2="380"/>
    <line x1="513" y1="313" x2="647" y2="447"/>
    <line x1="513" y1="447" x2="647" y2="313"/>
  </g>
</svg>
