<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#334155" opacity="0.4"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>

  <!-- Glowing Geometric Waves & Circuit Nodes -->
  <circle cx="600" cy="315" r="280" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="600" cy="315" r="200" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 8"/>
  <circle cx="600" cy="315" r="120" fill="none" stroke="url(#neonCyan)" stroke-width="3" filter="url(#glow)"/>

  <!-- Dynamic Abstract Node Network -->
  <path d="M 150 150 L 350 250 L 600 180 L 850 280 L 1050 160" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" opacity="0.8"/>
  <path d="M 150 480 L 380 380 L 600 450 L 820 360 L 1050 470" fill="none" stroke="url(#glowViolet)" stroke-width="2.5" opacity="0.8"/>

  <!-- Connected Vertices -->
  <circle cx="150" cy="150" r="7" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="350" cy="250" r="6" fill="#818cf8"/>
  <circle cx="600" cy="180" r="9" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="850" cy="280" r="6" fill="#818cf8"/>
  <circle cx="1050" cy="160" r="7" fill="#38bdf8" filter="url(#glow)"/>

  <circle cx="150" cy="480" r="7" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="380" cy="380" r="6" fill="#c084fc"/>
  <circle cx="600" cy="450" r="9" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="820" cy="360" r="6" fill="#c084fc"/>
  <circle cx="1050" cy="470" r="7" fill="#ec4899" filter="url(#glow)"/>

  <!-- Central Emblem Typography -->
  <text x="600" y="305" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    DEVELOPER CORE
  </text>
  <text x="600" y="348" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="6">
    WORKSPACE TOOLKIT &amp; CLOUD RUNTIME
  </text>

  <!-- Ambient Glow Spheres -->
  <circle cx="250" cy="500" r="140" fill="#818cf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="950" cy="150" r="140" fill="#ec4899" opacity="0.08" filter="url(#glow)"/>
</svg>
