      <stop offset="0%" stop-color="#ff7326"/>
      <stop offset="35%" stop-color="#e64a00"/>
      <stop offset="80%" stop-color="#a82b00"/>
      <stop offset="100%" stop-color="#541600"/>
    </linearGradient>
    <radialGradient id="chSh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <ellipse cx="400" cy="435" rx="360" ry="24" fill="url(#chSh)"/>

  <circle cx="210" cy="370" r="58" fill="#111"/>
  <circle cx="600" cy="370" r="58" fill="#111"/>

  <!-- Coke Bottle Hardtop Body -->
  <path d="M 90 365 L 110 320 L 320 300 Q 400 305 480 295 L 670 295 Q 730 330 730 375 L 90 375 Z" fill="url(#hemiOrange)" stroke="#4d1500" stroke-width="1.5"/>

  <!-- Fastback Flying Buttress Roofline -->
