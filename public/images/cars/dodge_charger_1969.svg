  <!-- Concealed Headlights Front Grille -->
  <rect x="90" y="325" width="25" height="38" rx="3" fill="#111" stroke="#bbb" stroke-width="2"/>
  <g stroke="#333" stroke-width="2">
    <line x1="95" y1="330" x2="95" y2="360"/>
    <line x1="102" y1="330" x2="102" y2="360"/>
    <line x1="109" y1="330" x2="109" y2="360"/>
  </g>

  <!-- Rear R/T Bumblebee Stripe -->
  <rect x="680" y="295" width="18" height="75" fill="#111"/>

  <!-- Magnum 500 Wheels -->
  <circle cx="215" cy="380" r="75" fill="#151515"/>
  <circle cx="215" cy="380" r="50" fill="#111" stroke="#ddd" stroke-width="4"/>
  <circle cx="215" cy="380" r="18" fill="#ddd"/>

  <circle cx="595" cy="380" r="75" fill="#151515"/>
  <circle cx="595" cy="380" r="50" fill="#111" stroke="#ddd" stroke-width="4"/>
  <circle cx="595" cy="380" r="18" fill="#ddd"/>
</svg>
