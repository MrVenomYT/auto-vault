<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rosso" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="40%" stop-color="#d40000"/>
      <stop offset="85%" stop-color="#8a0000"/>
      <stop offset="100%" stop-color="#4d0000"/>
    </linearGradient>
    <radialGradient id="gtoSh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <ellipse cx="400" cy="435" rx="360" ry="24" fill="url(#gtoSh)"/>

  <!-- Left Perspective Wheels -->
  <circle cx="210" cy="370" r="55" fill="#111"/>
  <circle cx="610" cy="370" r="55" fill="#111"/>

  <!-- Iconic 250 GTO Berlinetta Aerodynamic Bodywork -->
  <path d="M 100 370 Q 110 320 180 300 L 330 270 Q 400 190 500 195 L 560 210 Q 670 240 710 340 L 730 330 L 730 375 L 100 375 Z" fill="url(#rosso)" stroke="#700" stroke-width="1.5"/>

  <!-- Integrated Rear Kamm Tail Aerodynamic Spoiler Lip -->
  <path d="M 680 320 Q 710 295 730 325" fill="none" stroke="#ff4d4d" stroke-width="6" stroke-linecap="round"/>

  <!-- Three Nose D-Shaped Cooling Inlets (Signature GTO) -->
  <ellipse cx="140" cy="325" rx="9" ry="5" fill="#111"/>
  <ellipse cx="165" cy="320" rx="9" ry="5" fill="#111"/>
  <ellipse cx="190" cy="315" rx="9" ry="5" fill="#111"/>

  <!-- Side Air Extraction Vents with Chrome Strakes -->
  <path d="M 280 325 L 305 325 M 280 335 L 305 335" stroke="#111" stroke-width="3.5"/>

  <!-- Fastback Greenhouse Cockpit -->
  <path d="M 360 265 L 430 205 L 540 205 L 620 265 Z" fill="#161c24" stroke="#444" stroke-width="2"/>
  <path d="M 370 260 L 435 212 L 485 212 L 485 260 Z" fill="rgba(190,225,255,0.4)"/>
  <path d="M 495 260 L 495 212 L 535 212 L 605 260 Z" fill="rgba(190,225,255,0.4)"/>

  <!-- Covered Plexiglass Headlights -->
  <ellipse cx="130" cy="340" rx="14" ry="20" fill="rgba(220,240,255,0.6)" stroke="#aaa" stroke-width="1.5"/>
  <circle cx="130" cy="340" r="7" fill="#fff"/>

  <!-- Right Front Borrani Wire Wheel with Knock Off Spinner -->
  <circle cx="215" cy="380" r="75" fill="#151515"/>
  <circle cx="215" cy="380" r="50" fill="none" stroke="#ddd" stroke-width="3"/>
  <circle cx="215" cy="380" r="16" fill="#ccc"/>
  <!-- Borrani Wire Spokes -->
  <g stroke="#999" stroke-width="1.2">
    <line x1="215" y1="330" x2="215" y2="430"/>
    <line x1="165" y1="380" x2="265" y2="380"/>
    <line x1="180" y1="345" x2="250" y2="415"/>
    <line x1="180" y1="415" x2="250" y2="345"/>
  </g>
  <!-- Knock Off Spinner Ears -->
  <path d="M 215 372 L 215 388 M 207 380 L 223 380" stroke="#fff" stroke-width="4" stroke-linecap="round"/>

  <!-- Right Rear Borrani Wire Wheel -->
  <circle cx="605" cy="380" r="75" fill="#151515"/>
  <circle cx="605" cy="380" r="50" fill="none" stroke="#ddd" stroke-width="3"/>
  <circle cx="605" cy="380" r="16" fill="#ccc"/>
  <g stroke="#999" stroke-width="1.2">
    <line x1="605" y1="330" x2="605" y2="430"/>
    <line x1="555" y1="380" x2="655" y2="380"/>
    <line x1="570" y1="345" x2="640" y2="415"/>
    <line x1="570" y1="415" x2="640" y2="345"/>
  </g>
  <path d="M 605 372 L 605 388 M 597 380 L 613 380" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
</svg>
