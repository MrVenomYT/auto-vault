<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="60%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#a67c1e"/>
    </linearGradient>
    <radialGradient id="sh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <ellipse cx="400" cy="430" rx="340" ry="24" fill="url(#sh)"/>

  <!-- Left Side Wooden Spoke Wheels (Perspective) -->
  <circle cx="280" cy="300" r="85" fill="none" stroke="#111" stroke-width="8"/>
  <circle cx="280" cy="300" r="10" fill="url(#goldTrim)"/>
  <g stroke="#8a532d" stroke-width="2.5">
    <line x1="280" y1="215" x2="280" y2="385"/>
    <line x1="195" y1="300" x2="365" y2="300"/>
    <line x1="220" y1="240" x2="340" y2="360"/>
    <line x1="220" y1="360" x2="340" y2="240"/>
  </g>

  <circle cx="530" cy="290" r="90" fill="none" stroke="#111" stroke-width="8"/>
  <circle cx="530" cy="290" r="10" fill="url(#goldTrim)"/>
  <g stroke="#8a532d" stroke-width="2.5">
    <line x1="530" y1="200" x2="530" y2="380"/>
    <line x1="440" y1="290" x2="620" y2="290"/>
    <line x1="466" y1="226" x2="594" y2="354"/>
    <line x1="466" y1="354" x2="594" y2="226"/>
  </g>

  <!-- Iconic Curved Front Dashboard Tub Body -->
  <path d="M 210 270 Q 210 180 260 210 L 360 210 L 590 230 L 610 320 L 250 320 Q 210 320 210 270 Z" fill="url(#bodyGrad)" stroke="#333" stroke-width="2"/>
  <!-- Gold Pinstripe along Curve -->
  <path d="M 220 270 Q 220 195 260 220 L 580 240" fill="none" stroke="url(#goldTrim)" stroke-width="2.5"/>

  <!-- High Buttoned Tufted Bench Seat -->
  <rect x="360" y="160" width="110" height="55" rx="6" fill="#421a10" stroke="#210d08" stroke-width="3"/>
  <path d="M 360 160 Q 415 110 470 160" fill="none" stroke="#2b110b" stroke-width="20" stroke-linecap="round"/>
  <circle cx="385" cy="140" r="3" fill="#111"/>
  <circle cx="415" cy="140" r="3" fill="#111"/>
  <circle cx="445" cy="140" r="3" fill="#111"/>

  <!-- Tiller Steering Bar -->
  <path d="M 310 230 L 340 160 L 370 150" fill="none" stroke="url(#goldTrim)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="370" cy="150" r="6" fill="#111"/>

  <!-- Brass Carriage Lantern -->
  <rect x="250" y="220" width="25" height="35" rx="3" fill="url(#goldTrim)" stroke="#664910" stroke-width="1.5"/>
  <circle cx="262" cy="237" r="8" fill="#fffbe0"/>

  <!-- Right Front Spoke Wheel (Foreground) -->
  <circle cx="230" cy="360" r="95" fill="none" stroke="#111" stroke-width="10"/>
  <circle cx="230" cy="360" r="14" fill="url(#goldTrim)"/>
  <g stroke="#9e6236" stroke-width="3">
    <line x1="230" y1="265" x2="230" y2="455"/>
    <line x1="135" y1="360" x2="325" y2="360"/>
    <line x1="163" y1="293" x2="297" y2="427"/>
    <line x1="163" y1="427" x2="297" y2="293"/>
    <line x1="192" y1="272" x2="268" y2="448"/>
    <line x1="142" y1="322" x2="318" y2="398"/>
    <line x1="142" y1="398" x2="318" y2="322"/>
    <line x1="192" y1="448" x2="268" y2="272"/>
  </g>

  <!-- Right Rear Spoke Wheel (Foreground) -->
  <circle cx="580" cy="340" r="105" fill="none" stroke="#111" stroke-width="10"/>
  <circle cx="580" cy="340" r="15" fill="url(#goldTrim)"/>
  <g stroke="#9e6236" stroke-width="3">
    <line x1="580" y1="235" x2="580" y2="445"/>
    <line x1="475" y1="340" x2="685" y2="340"/>
    <line x1="506" y1="266" x2="654" y2="414"/>
    <line x1="506" y1="414" x2="654" y2="266"/>
    <line x1="538" y1="243" x2="622" y2="437"/>
    <line x1="483" y1="298" x2="677" y2="382"/>
    <line x1="483" y1="382" x2="677" y2="298"/>
    <line x1="538" y1="437" x2="622" y2="243"/>
  </g>
</svg>
