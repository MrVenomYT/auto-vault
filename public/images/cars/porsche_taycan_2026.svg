  </defs>

  <ellipse cx="400" cy="435" rx="360" ry="24" fill="url(#tSh)"/>

  <circle cx="210" cy="370" r="55" fill="#111"/>
  <circle cx="600" cy="370" r="58" fill="#111"/>

  <!-- Taycan Turbo S Cross Turismo Wagon Silhouette -->
