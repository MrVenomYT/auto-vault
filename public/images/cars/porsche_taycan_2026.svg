  <circle cx="215" cy="380" r="75" fill="#151515"/>
  <circle cx="215" cy="380" r="54" fill="#111" stroke="#444" stroke-width="3"/>
  <circle cx="215" cy="380" r="14" fill="#ffcc00"/>

  <circle cx="595" cy="380" r="78" fill="#151515"/>
