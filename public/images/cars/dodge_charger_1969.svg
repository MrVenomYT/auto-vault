  <path d="M 345 295 L 405 218 L 470 218 L 470 295 Z" fill="rgba(190,215,245,0.4)"/>
  <path d="M 480 295 L 480 218 L 515 218 L 620 295 Z" fill="rgba(190,215,245,0.4)"/>

  <!-- Black Vinyl Roof Texture Accent -->
