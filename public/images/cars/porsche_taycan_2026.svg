      <stop offset="0%" stop-color="#2a4d3b"/>
      <stop offset="40%" stop-color="#1b3629"/>
      <stop offset="85%" stop-color="#0e1f17"/>
      <stop offset="100%" stop-color="#050a08"/>
    </linearGradient>
    <radialGradient id="tSh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
