<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceda2"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#8b6528"/>
    </linearGradient>
    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="440" rx="350" ry="25" fill="url(#shadowGrad)"/>

  <!-- Large Rear Spoke Wheel (Right) -->
  <circle cx="580" cy="300" r="140" fill="none" stroke="url(#ironGrad)" stroke-width="12"/>
  <circle cx="580" cy="300" r="134" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="580" cy="300" r="22" fill="url(#brassGrad)"/>
  <!-- Spokes -->
  <g stroke="#888" stroke-width="2" opacity="0.85">
    <line x1="580" y1="160" x2="580" y2="440"/>
    <line x1="440" y1="300" x2="720" y2="300"/>
    <line x1="481" y1="201" x2="679" y2="399"/>
    <line x1="481" y1="399" x2="679" y2="201"/>
    <line x1="526" y1="171" x2="634" y2="429"/>
    <line x1="451" y1="246" x2="709" y2="354"/>
    <line x1="451" y1="354" x2="709" y2="246"/>
    <line x1="526" y1="429" x2="634" y2="171"/>
  </g>

  <!-- Large Rear Spoke Wheel (Left Rear - Perspective) -->
  <circle cx="480" cy="270" r="120" fill="none" stroke="#1c1c1c" stroke-width="10"/>
  <circle cx="480" cy="270" r="18" fill="#7a6130"/>
  <g stroke="#666" stroke-width="1.5" opacity="0.6">
    <line x1="480" y1="150" x2="480" y2="390"/>
    <line x1="360" y1="270" x2="600" y2="270"/>
    <line x1="395" y1="185" x2="565" y2="355"/>
    <line x1="395" y1="355" x2="565" y2="185"/>
  </g>

  <!-- Main Tubular Steel Chassis Frame -->
  <path d="M 210 370 L 410 350 L 580 300 L 480 270 L 320 320 Z" fill="none" stroke="url(#ironGrad)" stroke-width="10" stroke-linejoin="round"/>
  <path d="M 210 370 L 340 220 L 520 220 L 580 300" fill="none" stroke="#1a1a1a" stroke-width="8"/>

  <!-- Horizontal Engine Block & Belt Drive -->
  <rect x="420" y="270" width="90" height="45" rx="6" fill="url(#ironGrad)" stroke="#444" stroke-width="2"/>
  <circle cx="450" cy="290" r="30" fill="none" stroke="url(#brassGrad)" stroke-width="6"/>
  <circle cx="450" cy="290" r="6" fill="#222"/>
  <path d="M 450 260 L 580 280 M 450 320 L 580 320" stroke="#a07840" stroke-width="5"/>

  <!-- Wooden Bench Seat with Tufted Leather Backing -->
  <path d="M 370 170 L 470 170 L 490 230 L 350 230 Z" fill="#2d1d13" stroke="#4a3020" stroke-width="3"/>
  <path d="M 370 170 Q 420 130 470 170" fill="none" stroke="#1f140e" stroke-width="18" stroke-linecap="round"/>
  <rect x="375" y="190" width="90" height="35" rx="4" fill="#442a1b" stroke="#1a100a" stroke-width="2"/>

  <!-- Front Tiller Fork & Steering Mechanism -->
  <path d="M 210 370 L 250 270 L 290 200 L 330 190" fill="none" stroke="url(#brassGrad)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="330" cy="190" r="7" fill="url(#brassGrad)"/>

  <!-- Front Steered Spoke Wheel -->
  <circle cx="210" cy="370" r="70" fill="none" stroke="url(#ironGrad)" stroke-width="9"/>
  <circle cx="210" cy="370" r="66" fill="none" stroke="#666" stroke-width="1.5"/>
  <circle cx="210" cy="370" r="14" fill="url(#brassGrad)"/>
  <g stroke="#888" stroke-width="1.5" opacity="0.85">
    <line x1="210" y1="300" x2="210" y2="440"/>
    <line x1="140" y1="370" x2="280" y2="370"/>
    <line x1="160" y1="320" x2="260" y2="420"/>
    <line x1="160" y1="420" x2="260" y2="320"/>
  </g>

  <!-- Brass Patent Plaque & Historic Label -->
  <rect x="360" y="310" width="40" height="20" rx="3" fill="url(#brassGrad)" stroke="#7a6130" stroke-width="1.5"/>
  <text x="380" y="324" font-family="sans-serif" font-size="7" font-weight="bold" fill="#222" text-anchor="middle">BENZ 1886</text>
</svg>
