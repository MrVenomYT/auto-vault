<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="silverBirch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cfd5dc"/>
      <stop offset="75%" stop-color="#939ba6"/>
      <stop offset="100%" stop-color="#555d66"/>
    </linearGradient>
    <linearGradient id="dbChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ccd4dc"/>
      <stop offset="100%" stop-color="#7a8591"/>
    </linearGradient>
    <radialGradient id="dbSh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <ellipse cx="400" cy="435" rx="360" ry="24" fill="url(#dbSh)"/>

  <circle cx="210" cy="370" r="55" fill="#111"/>
  <circle cx="600" cy="370" r="55" fill="#111"/>

  <!-- DB5 Grand Tourer Bodywork -->
  <path d="M 110 370 Q 115 320 180 300 L 330 280 Q 380 200 480 200 L 540 205 Q 660 230 705 340 L 710 375 L 110 375 Z" fill="url(#silverBirch)" stroke="#5f6770" stroke-width="1.5"/>

  <!-- Side Fender Strake with Chrome Trim -->
  <rect x="270" y="325" width="45" height="10" rx="2" fill="#222" stroke="url(#dbChrome)" stroke-width="1.5"/>

  <!-- Glass Greenhouse and Thin Chrome Pillars -->
  <path d="M 350 270 L 410 210 L 530 210 L 610 270 Z" fill="#18222d" stroke="url(#dbChrome)" stroke-width="2.5"/>
  <path d="M 360 265 L 415 218 L 475 218 L 475 265 Z" fill="rgba(180,215,245,0.4)"/>
  <path d="M 485 265 L 485 218 L 525 218 L 595 265 Z" fill="rgba(180,215,245,0.4)"/>

  <!-- Signature Aston Martin Grille -->
  <path d="M 120 345 Q 140 330 160 345 L 155 365 Q 140 370 125 365 Z" fill="#111" stroke="url(#dbChrome)" stroke-width="2.5"/>

  <!-- Chrome Bumpers -->
  <path d="M 95 370 Q 120 380 150 375" fill="none" stroke="url(#dbChrome)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 680 375 Q 710 375 720 365" fill="none" stroke="url(#dbChrome)" stroke-width="5" stroke-linecap="round"/>

  <!-- Borrani Wire Wheels -->
  <circle cx="215" cy="380" r="75" fill="#151515"/>
  <circle cx="215" cy="380" r="50" fill="none" stroke="url(#dbChrome)" stroke-width="3"/>
  <circle cx="215" cy="380" r="16" fill="url(#dbChrome)"/>
  <g stroke="#999" stroke-width="1.2">
    <line x1="215" y1="330" x2="215" y2="430"/>
    <line x1="165" y1="380" x2="265" y2="380"/>
  </g>

  <circle cx="595" cy="380" r="75" fill="#151515"/>
  <circle cx="595" cy="380" r="50" fill="none" stroke="url(#dbChrome)" stroke-width="3"/>
  <circle cx="595" cy="380" r="16" fill="url(#dbChrome)"/>
  <g stroke="#999" stroke-width="1.2">
    <line x1="595" y1="330" x2="595" y2="430"/>
    <line x1="545" y1="380" x2="645" y2="380"/>
  </g>
</svg>
