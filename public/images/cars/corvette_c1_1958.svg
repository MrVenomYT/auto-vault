<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="c1Red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="40%" stop-color="#d40000"/>
      <stop offset="85%" stop-color="#800000"/>
      <stop offset="100%" stop-color="#400000"/>
    </linearGradient>
    <linearGradient id="c1White" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#eaeaea"/>
      <stop offset="100%" stop-color="#cccccc"/>
    </linearGradient>
    <radialGradient id="c1Sh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <ellipse cx="400" cy="435" rx="360" ry="24" fill="url(#c1Sh)"/>

  <circle cx="210" cy="370" r="55" fill="#111"/>
  <circle cx="600" cy="370" r="58" fill="#111"/>

  <!-- Corvette C1 Roadster Body -->
  <path d="M 80 375 Q 90 320 200 300 L 330 280 Q 400 210 500 210 L 560 215 Q 670 240 730 340 L 720 380 L 80 380 Z" fill="url(#c1Red)" stroke="#660000" stroke-width="1.5"/>

  <!-- Contrasting White Sculpted Side Cove (Signature 1958 C1) -->
  <path d="M 270 330 Q 320 290 440 290 L 460 360 Q 320 370 270 330 Z" fill="url(#c1White)" stroke="#ddd" stroke-width="2"/>

  <!-- Dual Quad Chrome Headlights -->
  <circle cx="120" cy="325" r="12" fill="#fff" stroke="#ccc" stroke-width="2"/>
  <circle cx="145" cy="320" r="12" fill="#fff" stroke="#ccc" stroke-width="2"/>

  <!-- Whitewall Tires with Chrome Hubcaps and Spinners -->
  <circle cx="215" cy="380" r="75" fill="#151515"/>
  <circle cx="215" cy="380" r="60" fill="none" stroke="#fff" stroke-width="8"/>
  <circle cx="215" cy="380" r="42" fill="#ccc" stroke="#333" stroke-width="2"/>
  <circle cx="215" cy="380" r="14" fill="#fff"/>

  <circle cx="595" cy="380" r="78" fill="#151515"/>
  <circle cx="595" cy="380" r="62" fill="none" stroke="#fff" stroke-width="8"/>
  <circle cx="595" cy="380" r="44" fill="#ccc" stroke="#333" stroke-width="2"/>
  <circle cx="595" cy="380" r="15" fill="#fff"/>
</svg>
