<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a532d"/>
      <stop offset="50%" stop-color="#5c3418"/>
      <stop offset="100%" stop-color="#3d210c"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#444"/>
      <stop offset="50%" stop-color="#222"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.55)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <ellipse cx="400" cy="430" rx="330" ry="22" fill="url(#shadow)"/>

  <!-- Four Spoke Bicycle Style Wheels (Front Left, Rear Left, Rear Right, Front Right) -->
  <!-- Left Rear Wheel (Background perspective) -->
  <circle cx="530" cy="270" r="100" fill="none" stroke="#222" stroke-width="8"/>
  <circle cx="530" cy="270" r="12" fill="#888"/>
  <g stroke="#555" stroke-width="1.5">
    <line x1="530" y1="170" x2="530" y2="370"/>
    <line x1="430" y1="270" x2="630" y2="270"/>
    <line x1="460" y1="200" x2="600" y2="340"/>
    <line x1="460" y1="340" x2="600" y2="200"/>
  </g>

  <!-- Left Front Wheel (Background perspective) -->
  <circle cx="270" cy="290" r="95" fill="none" stroke="#222" stroke-width="8"/>
  <circle cx="270" cy="290" r="12" fill="#888"/>
  <g stroke="#555" stroke-width="1.5">
    <line x1="270" y1="195" x2="270" y2="385"/>
    <line x1="175" y1="290" x2="365" y2="290"/>
    <line x1="202" y1="222" x2="338" y2="358"/>
    <line x1="202" y1="358" x2="338" y2="222"/>
  </g>

  <!-- Wooden Chassis Frame & Gearbox -->
  <rect x="260" y="270" width="340" height="40" rx="4" fill="url(#woodGrad)" stroke="#2b1507" stroke-width="2"/>
  <rect x="420" y="230" width="130" height="60" rx="4" fill="url(#metalGrad)" stroke="#555" stroke-width="2"/>
  <!-- Two Cylinder Ethanol Engine -->
  <circle cx="460" cy="255" r="22" fill="#1f1f1f" stroke="#888" stroke-width="2"/>
  <circle cx="510" cy="255" r="22" fill="#1f1f1f" stroke="#888" stroke-width="2"/>
  <!-- Drive Belt -->
  <path d="M 460 255 L 590 320" stroke="#b08d57" stroke-width="6"/>

  <!-- Padded Bench Seat on Leaf Springs -->
  <path d="M 330 240 Q 380 220 430 240" fill="none" stroke="#333" stroke-width="6"/>
  <rect x="340" y="170" width="95" height="45" rx="6" fill="#1c140d" stroke="#000" stroke-width="2"/>
  <path d="M 340 170 L 335 120 L 435 120 L 435 170 Z" fill="#2d1d13" stroke="#1c140d" stroke-width="2"/>
  <!-- Tufted Buttons -->
  <circle cx="360" cy="145" r="3" fill="#000"/>
  <circle cx="385" cy="145" r="3" fill="#000"/>
  <circle cx="410" cy="145" r="3" fill="#000"/>

  <!-- Steering Tiller & Handle -->
  <path d="M 310 270 L 330 180 L 350 150" fill="none" stroke="#c5a059" stroke-width="6" stroke-linecap="round"/>
  <circle cx="350" cy="150" r="7" fill="#8a532d"/>

  <!-- Right Front Spoke Wheel (Foreground) -->
  <circle cx="210" cy="350" r="105" fill="none" stroke="#111" stroke-width="10"/>
  <circle cx="210" cy="350" r="16" fill="#c5a059"/>
  <g stroke="#999" stroke-width="1.8">
    <line x1="210" y1="245" x2="210" y2="455"/>
    <line x1="105" y1="350" x2="315" y2="350"/>
    <line x1="135" y1="275" x2="285" y2="425"/>
    <line x1="135" y1="425" x2="285" y2="275"/>
    <line x1="168" y1="254" x2="252" y2="446"/>
    <line x1="114" y1="308" x2="306" y2="392"/>
    <line x1="114" y1="392" x2="306" y2="308"/>
    <line x1="168" y1="446" x2="252" y2="254"/>
  </g>

  <!-- Right Rear Spoke Wheel (Foreground) -->
  <circle cx="590" cy="320" r="115" fill="none" stroke="#111" stroke-width="10"/>
  <circle cx="590" cy="320" r="18" fill="#c5a059"/>
  <g stroke="#999" stroke-width="1.8">
    <line x1="590" y1="205" x2="590" y2="435"/>
    <line x1="475" y1="320" x2="705" y2="320"/>
    <line x1="508" y1="238" x2="672" y2="402"/>
    <line x1="508" y1="402" x2="672" y2="238"/>
    <line x1="544" y1="214" x2="636" y2="426"/>
    <line x1="485" y1="274" x2="695" y2="366"/>
    <line x1="485" y1="366" x2="695" y2="274"/>
    <line x1="544" y1="426" x2="636" y2="214"/>
  </g>
</svg>
