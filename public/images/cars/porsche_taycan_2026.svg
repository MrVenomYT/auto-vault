  <rect x="135" y="315" width="22" height="15" rx="3" fill="#111" stroke="#333"/>
  <circle cx="140" cy="320" r="2.5" fill="#00ffff"/>
  <circle cx="150" cy="320" r="2.5" fill="#00ffff"/>
  <circle cx="140" cy="325" r="2.5" fill="#00ffff"/>
  <circle cx="150" cy="325" r="2.5" fill="#00ffff"/>

