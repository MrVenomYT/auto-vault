      <stop offset="0%" stop-color="#008060"/>
      <stop offset="40%" stop-color="#005943"/>
      <stop offset="85%" stop-color="#003326"/>
      <stop offset="100%" stop-color="#001a13"/>
    </linearGradient>
    <radialGradient id="vSh" cx="50%" cy="50%" r="50%">
